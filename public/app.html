<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIAOCHEN - 图片管理</title>
  <meta name="description" content="XIAOCHEN 图片素材管理、上传、预览与下载。">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="image-library-page">
  <a class="skip-link" href="#image-library-main">跳到图片列表</a>
  <div class="fx-bg" aria-hidden="true"></div>
  <div class="video-layout">
    <aside class="video-sidebar">
      <div class="video-brand">
        <span class="video-brand-mark">X</span>
        <div>
          <strong>XIAOCHEN</strong>
          <span>内容控制台</span>
        </div>
      </div>

      <nav class="video-nav" aria-label="主导航">
        <span class="video-nav-section">导航</span>
        <a href="/home.html"><i class="ph ph-house nav-icon" aria-hidden="true"></i><span>主页</span></a>
        <a class="active" href="/app.html" aria-current="page"><i class="ph ph-image-square nav-icon" aria-hidden="true"></i><span>图片库</span></a>
        <a href="/video.html"><i class="ph ph-video-camera nav-icon" aria-hidden="true"></i><span>视频库</span></a>
        <span class="video-nav-section">账户</span>
        <a href="/profile.html"><i class="ph ph-user-circle nav-icon" aria-hidden="true"></i><span>个人中心</span></a>
      </nav>

      <a class="video-logout" href="/login.html"><i class="ph ph-sign-out nav-icon" aria-hidden="true"></i><span>退出登录</span></a>
    </aside>

    <main class="video-main">
      <header class="video-topbar">
        <div class="video-page-title">
          <h1>图片库</h1>
          <p>管理、筛选和使用已上传的图片素材</p>
        </div>
        <div class="video-topbar-actions">
          <button class="video-btn ghost" type="button" id="open-first-image">
            <i class="ph ph-eye" aria-hidden="true"></i><span>预览首图</span>
          </button>
          <button class="video-btn primary" type="button" id="image-upload-trigger" hidden>
            <i class="ph ph-upload-simple" aria-hidden="true"></i><span>上传图片</span>
          </button>
        </div>
      </header>

      <section class="video-content image-content">
        <section class="image-hero-card" aria-labelledby="image-hero-title">
          <div class="image-hero-copy">
            <span class="image-hero-tag"><i class="ph ph-folder-simple" aria-hidden="true"></i>本地资源</span>
            <h2 id="image-hero-title">管理上传后的图片素材</h2>
            <div class="image-hero-meta">
              <div>
                <i class="ph ph-stack" aria-hidden="true"></i>
                <span><strong id="hero-image-count">0</strong> 张图片<small>已加载素材总数</small></span>
              </div>
              <div>
                <i class="ph ph-hard-drives" aria-hidden="true"></i>
                <span><strong id="hero-image-size">--</strong><small>当前占用空间</small></span>
              </div>
              <div>
                <i class="ph ph-file-image" aria-hidden="true"></i>
                <span><strong id="hero-main-format">--</strong> / JPG / WEBP<small>常用图片格式</small></span>
              </div>
            </div>
          </div>
          <div class="image-hero-preview">
            <img alt="图片预览" id="hero-preview">
            <div class="image-hero-placeholder" id="hero-placeholder">
              <i class="ph ph-image-square" aria-hidden="true"></i>
              <span>等待图片</span>
            </div>
          </div>
        </section>

        <section class="image-upload-bar" id="upload-panel" aria-labelledby="upload-panel-title" hidden>
          <div class="panel-heading">
            <div>
              <span class="section-rule" aria-hidden="true"></span>
              <h2 id="upload-panel-title">上传图片</h2>
            </div>
            <p>支持拖拽或选择文件，单张最大 20MB</p>
          </div>
          <form class="image-upload-form" id="upload-form">
            <label class="image-upload-drop" id="image-drop-zone">
              <input type="file" id="upload-image" name="image" accept=".png,.jpg,.jpeg,.gif,.bmp,.webp,.svg,image/*">
              <span class="image-upload-icon"><i class="ph ph-cloud-arrow-up" aria-hidden="true"></i></span>
              <span>
                <strong>拖拽图片到此处上传</strong>
                <em>或点击选择本地文件</em>
              </span>
            </label>
            <div class="image-format-tags">
              <b>PNG</b><b>JPG</b><b>WEBP</b><b>GIF</b><b>SVG</b>
            </div>
            <button class="video-btn primary upload-submit" type="submit" id="upload-submit">
              <i class="ph ph-upload-simple" aria-hidden="true"></i><span>上传</span>
            </button>
          </form>

          <div class="upload-status compact-status" id="upload-status" role="status" aria-live="polite">
            <div class="upload-message" id="upload-message">等待选择图片。</div>
            <div class="upload-progress" id="upload-progress" aria-hidden="true">
              <div class="upload-progress-bar" id="upload-progress-bar"></div>
            </div>
            <div class="upload-meta" id="upload-meta"></div>
            <button class="video-btn ghost upload-retry" type="button" id="upload-retry" hidden>重新上传</button>
          </div>
        </section>

        <section class="image-library" id="image-library-main" tabindex="-1">
          <div class="video-section-head">
            <div>
              <h2>图片列表 <b id="image-count">0</b></h2>
              <p>按最新资源优先展示</p>
            </div>
          </div>

          <div class="video-filter-bar" role="search">
            <label class="video-search">
              <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
              <span class="sr-only">搜索图片</span>
              <input id="image-search-input" type="search" placeholder="搜索图片文件名...">
            </label>
            <div class="video-filter-options" aria-label="图片格式筛选">
              <button class="video-chip active" type="button" data-filter="all" aria-pressed="true">全部</button>
              <button class="video-chip" type="button" data-filter="png" aria-pressed="false">PNG</button>
              <button class="video-chip" type="button" data-filter="jpg" aria-pressed="false">JPG</button>
              <button class="video-chip" type="button" data-filter="webp" aria-pressed="false">WEBP</button>
              <button class="video-chip" type="button" data-filter="gif" aria-pressed="false">GIF</button>
              <button class="video-chip" type="button" data-filter="svg" aria-pressed="false">SVG</button>
            </div>
            <div class="video-view-toggle" aria-label="视图切换">
              <button class="active" type="button" data-view="grid" aria-pressed="true" title="网格视图">
                <i class="ph ph-squares-four" aria-hidden="true"></i><span class="sr-only">网格视图</span>
              </button>
              <button type="button" data-view="list" aria-pressed="false" title="列表视图">
                <i class="ph ph-list" aria-hidden="true"></i><span class="sr-only">列表视图</span>
              </button>
            </div>
          </div>

          <div class="redesign-image-grid" id="gallery-grid" aria-live="polite" aria-busy="true"></div>
          <div class="gallery-load-sentinel" id="gallery-load-sentinel" aria-live="polite"></div>

          <div class="image-stats" aria-label="图片统计">
            <div>
              <strong id="image-total-count">0</strong>
              <span>图片总数</span>
            </div>
            <div>
              <strong id="image-total-size">--</strong>
              <span>已用空间</span>
            </div>
            <div>
              <strong id="image-png-count">0</strong>
              <span>PNG 格式</span>
            </div>
            <div>
              <strong id="image-average-width">--</strong>
              <span>平均宽度</span>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <template id="gallery-card-template">
    <article class="redesign-image-card">
      <div class="redesign-image-thumb">
        <img alt="">
        <div class="redesign-image-overlay">
          <button class="image-overlay-btn preview-action" type="button" aria-label="预览图片" title="预览">
            <i class="ph ph-eye" aria-hidden="true"></i>
          </button>
          <a class="image-overlay-btn download-action" href="#" download aria-label="下载图片" title="下载">
            <i class="ph ph-download-simple" aria-hidden="true"></i>
          </a>
          <button class="image-overlay-btn copy-action" type="button" aria-label="复制图片路径" title="复制路径">
            <i class="ph ph-copy" aria-hidden="true"></i>
          </button>
          <button class="image-overlay-btn share-action" type="button" aria-label="分享图片" title="分享">
            <i class="ph ph-share-network" aria-hidden="true"></i>
          </button>
        </div>
        <span class="img-fmt"></span>
        <span class="img-new">新</span>
        <span class="img-resolution">--</span>
      </div>
      <div class="redesign-image-info">
        <strong class="redesign-image-name"></strong>
        <span class="redesign-image-path"></span>
        <div class="redesign-image-footer">
          <span class="redesign-image-size">--</span>
          <a class="image-mini-action" href="#" download aria-label="下载图片" title="下载">
            <i class="ph ph-download-simple" aria-hidden="true"></i><span class="sr-only">下载</span>
          </a>
        </div>
      </div>
    </article>
  </template>

  <div class="comment-drawer" id="comment-drawer" aria-hidden="true">
    <div class="comment-drawer-backdrop" data-close="comment-drawer"></div>
    <aside class="comment-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="comment-drawer-title">
      <div class="comment-drawer-head">
        <div>
          <span>Comments</span>
          <h3 id="comment-drawer-title">评论</h3>
        </div>
        <button class="comment-drawer-close" type="button" id="comment-drawer-close" aria-label="关闭评论" title="关闭">
          <i class="ph ph-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="comment-drawer-count" id="comment-count-label">0 条评论</div>
      <div class="comment-drawer-body" id="comment-list"></div>
      <div class="comment-drawer-foot">
        <textarea id="comment-input" maxlength="300" placeholder="写下你的评论..." rows="3"></textarea>
        <div class="comment-submit-row">
          <span class="comment-char-count" id="comment-char-count">0/300</span>
          <button class="video-btn primary" type="button" id="comment-submit">发布</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-close="lightbox"></div>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button class="lightbox-close" type="button" id="lightbox-close" aria-label="关闭预览" title="关闭">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
      <div class="lightbox-meta">
        <div class="eyebrow">图片预览</div>
        <h3 id="lightbox-title">图片预览</h3>
        <a id="lightbox-link" href="#" target="_blank" rel="noopener noreferrer">
          <i class="ph ph-arrow-square-out" aria-hidden="true"></i>新窗口打开
        </a>
      </div>
      <div class="lightbox-stage">
        <img id="lightbox-image" src="" alt="大图预览">
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
