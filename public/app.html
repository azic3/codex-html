<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIAOCHEN - 图片管理</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-logo">
        <span class="app-logo-mark">XC</span>
        <div>
          <strong>XIAOCHEN</strong>
          <span>内容控制台</span>
        </div>
      </div>

      <nav class="app-nav" aria-label="主导航">
        <a class="active" href="/app.html">图片库</a>
        <a href="/video.html">视频库</a>
        <a href="/images/">图片目录</a>
        <a href="/videos/">视频目录</a>
        <a href="/profile.html">个人中心</a>
        <a href="/login.html">退出登录</a>
      </nav>
    </aside>

    <main class="app-main">
      <header class="page-head">
        <div>
          <div class="eyebrow">Images</div>
          <h1>图片库</h1>
        </div>
        <div class="page-actions">
          <a class="action-btn secondary" href="/images/">打开目录</a>
          <button class="action-btn" type="button" id="open-first-image">预览首图</button>
        </div>
      </header>

      <section class="hero-card">
        <div class="hero-copy">
          <span class="status-pill">本地资源</span>
          <h2>管理上传后的图片素材</h2>
          <p>上传成功的图片会保存到 <code>/images/</code>，并显示在下方列表中。</p>
        </div>
        <img src="/images/凡人修仙_001.png" alt="图片预览" id="hero-preview">
      </section>

      <section class="upload-panel" id="upload-panel" hidden>
        <div class="section-head compact">
          <div>
            <div class="eyebrow">Upload</div>
            <h2>上传图片</h2>
          </div>
          <p>PNG、JPG、JPEG、GIF、BMP、WEBP、SVG，单张最大 20MB。</p>
        </div>

        <form class="upload-form" id="upload-form">
          <label class="upload-field">
            <span>选择图片</span>
            <input type="file" id="upload-image" name="image" accept=".png,.jpg,.jpeg,.gif,.bmp,.webp,.svg,image/*">
          </label>
          <button class="action-btn upload-btn" type="submit" id="upload-submit">上传</button>
        </form>

        <div class="upload-status" id="upload-status" aria-live="polite">
          <div class="upload-message" id="upload-message">等待选择图片。</div>
          <div class="upload-progress" id="upload-progress" aria-hidden="true">
            <div class="upload-progress-bar" id="upload-progress-bar"></div>
          </div>
          <div class="upload-meta" id="upload-meta"></div>
          <button class="action-btn secondary upload-retry" type="button" id="upload-retry" hidden>重新上传</button>
        </div>
      </section>

      <section class="gallery-panel">
        <div class="section-head">
          <div>
            <div class="eyebrow">Library</div>
            <h2>图片列表</h2>
          </div>
          <p>按最新资源优先展示。</p>
        </div>

        <div class="gallery-grid" id="gallery-grid"></div>
      </section>
    </main>
  </div>

  <template id="gallery-card-template">
    <article class="gallery-card">
      <button class="gallery-preview-btn" type="button">
        <span class="gallery-thumb">
          <img src="" alt="">
        </span>
      </button>
      <span class="gallery-copy">
        <strong></strong>
        <span></span>
        <a class="gallery-download" href="#" download>下载图片</a>
      </span>
    </article>
  </template>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-close="lightbox"></div>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button class="lightbox-close" type="button" id="lightbox-close">关闭</button>
      <div class="lightbox-meta">
        <div class="eyebrow">Preview</div>
        <h3 id="lightbox-title">图片预览</h3>
        <a id="lightbox-link" href="#" target="_blank" rel="noopener noreferrer">新窗口打开</a>
      </div>
      <div class="lightbox-stage">
        <img id="lightbox-image" src="" alt="大图预览">
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
