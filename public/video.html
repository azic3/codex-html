<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIAOCHEN - 视频管理</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-logo">
        <span class="app-logo-mark">XC</span>
        <div>
          <strong>XIAOCHEN</strong>
          <span>内容控制台</span>
        </div>
      </div>

      <nav class="app-nav" aria-label="主导航">
        <a href="/app.html">图片库</a>
        <a class="active" href="/video.html">视频库</a>
        <a href="/images/">图片目录</a>
        <a href="/videos/">视频目录</a>
        <a href="/profile.html">个人中心</a>
        <a href="/login.html">退出登录</a>
      </nav>
    </aside>

    <main class="app-main">
      <header class="page-head">
        <div>
          <div class="eyebrow">Videos</div>
          <h1>视频库</h1>
        </div>
        <div class="page-actions">
          <a class="action-btn secondary" href="/videos/">打开目录</a>
        </div>
      </header>

      <section class="hero-card video-hero">
        <div class="hero-copy">
          <span class="status-pill">媒体资源</span>
          <h2>集中管理视频文件</h2>
          <p>上传成功的视频会保存到 <code>/videos/</code>，列表支持直接播放。</p>
        </div>
        <div class="hero-video-note">
          <strong>支持格式</strong>
          <span>MP4 / WEBM / OGG / MOV / AVI / MKV / M4V</span>
          <strong>大小限制</strong>
          <span>单个视频最大 1GB</span>
        </div>
      </section>

      <section class="upload-panel" id="video-upload-panel" hidden>
        <div class="section-head compact">
          <div>
            <div class="eyebrow">Upload</div>
            <h2>上传视频</h2>
          </div>
          <p>视频文件会进入独立目录。</p>
        </div>

        <form class="upload-form" id="video-upload-form">
          <label class="upload-field">
            <span>选择视频</span>
            <input type="file" id="upload-video" name="video" accept=".mp4,.webm,.ogg,.mov,.avi,.mkv,.m4v,video/*">
          </label>
          <button class="action-btn upload-btn" type="submit" id="video-upload-submit">上传</button>
        </form>

        <div class="upload-status" id="video-upload-status" aria-live="polite">
          <div class="upload-message" id="video-upload-message">等待选择视频。</div>
          <div class="upload-progress" id="video-upload-progress" aria-hidden="true">
            <div class="upload-progress-bar" id="video-upload-progress-bar"></div>
          </div>
          <div class="upload-meta" id="video-upload-meta"></div>
          <button class="action-btn secondary upload-retry" type="button" id="video-upload-retry" hidden>重新上传</button>
        </div>
      </section>

      <section class="gallery-panel">
        <div class="section-head">
          <div>
            <div class="eyebrow">Library</div>
            <h2>视频列表</h2>
          </div>
          <p>按最新资源优先展示。</p>
        </div>

        <div class="video-grid" id="video-grid"></div>
      </section>
    </main>
  </div>

  <template id="video-card-template">
    <article class="video-card">
      <div class="video-frame">
        <video controls preload="metadata"></video>
      </div>
      <div class="gallery-copy">
        <strong></strong>
        <span></span>
      </div>
    </article>
  </template>

  <script src="/js/video.js"></script>
</body>
</html>
