<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIAOCHEN - 视频管理</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="video-library-page">
  <div class="fx-bg" aria-hidden="true"></div>
  <div class="fx-particles" aria-hidden="true">
    <span style="--x: 8%; --s: 2px; --d: 13s; --delay: 0s;"></span>
    <span style="--x: 15%; --s: 1px; --d: 17s; --delay: -5s;"></span>
    <span style="--x: 24%; --s: 3px; --d: 22s; --delay: -9s;"></span>
    <span style="--x: 32%; --s: 2px; --d: 15s; --delay: -2s;"></span>
    <span style="--x: 41%; --s: 1px; --d: 19s; --delay: -11s;"></span>
    <span style="--x: 49%; --s: 2px; --d: 16s; --delay: -7s;"></span>
    <span style="--x: 58%; --s: 3px; --d: 24s; --delay: -4s;"></span>
    <span style="--x: 66%; --s: 1px; --d: 18s; --delay: -13s;"></span>
    <span style="--x: 73%; --s: 2px; --d: 21s; --delay: -8s;"></span>
    <span style="--x: 82%; --s: 1px; --d: 14s; --delay: -3s;"></span>
    <span style="--x: 91%; --s: 2px; --d: 20s; --delay: -10s;"></span>
    <span style="--x: 96%; --s: 3px; --d: 25s; --delay: -6s;"></span>
  </div>
  <div class="video-layout">
    <aside class="video-sidebar">
      <div class="video-brand">
        <span class="video-brand-mark">X</span>
        <strong>XIAOCHEN</strong>
        <span>内容控制台</span>
      </div>

      <nav class="video-nav" aria-label="主导航">
        <a href="/home.html"><span class="nav-icon">H</span>主页</a>
        <span class="video-nav-section">· 媒体库 ·</span>
        <a href="/app.html"><span class="nav-icon">I</span>图片库</a>
        <a class="active" href="/video.html"><span class="nav-icon">V</span>视频库</a>
        <a href="/game.html"><span class="nav-icon">G</span>游戏</a>
        <span class="video-nav-section">· 账户 ·</span>
        <a href="/profile.html"><span class="nav-icon">U</span>个人中心</a>
      </nav>

      <a class="video-logout" href="/login.html"><span class="nav-icon">Q</span>退出登录</a>
    </aside>

    <main class="video-main">
      <header class="video-topbar">
        <div class="video-page-title">
          <span>· 影藏阁 ·</span>
          <h1>视频库</h1>
        </div>
        <div class="video-topbar-actions">
          <button class="video-btn primary" type="button" id="video-upload-trigger" hidden>上传视频</button>
        </div>
      </header>

      <section class="video-content">
        <section class="video-upload-card" id="video-upload-panel" hidden>
          <div class="corner-deco c-tl"></div>
          <div class="corner-deco c-tr"></div>
          <div class="corner-deco c-bl"></div>
          <div class="corner-deco c-br"></div>
          <form class="video-upload-form" id="video-upload-form">
            <label class="video-drop-zone" id="video-drop-zone">
              <input type="file" id="upload-video" name="video" accept=".mp4,.webm,.ogg,.mov,.avi,.mkv,.m4v,video/*">
              <span class="video-upload-icon">UP</span>
              <strong>拖拽视频到此处上传</strong>
              <span>或 <em>点击选择文件</em> 开始上传</span>
              <span class="format-row">
                <b>MP4</b><b>WEBM</b><b>MOV</b><b>MKV</b><b>AVI</b><b>M4V</b>
              </span>
            </label>

            <div class="video-upload-meta">
              <span class="meta-kicker">上传规范</span>
              <div class="meta-line">
                <strong>支持格式</strong>
                <span>MP4 / WEBM / OGG / MOV / AVI / MKV / M4V</span>
              </div>
              <div class="meta-line">
                <strong>大小限制</strong>
                <span>单个视频最大 1GB</span>
              </div>
              <div class="meta-line">
                <strong>存储路径</strong>
                <span>/videos/</span>
              </div>
              <button class="video-btn primary upload-submit" type="submit" id="video-upload-submit">上传</button>
            </div>
          </form>

          <div class="upload-status compact-status" id="video-upload-status" aria-live="polite">
            <div class="upload-message" id="video-upload-message">等待选择视频。</div>
            <div class="upload-progress" id="video-upload-progress" aria-hidden="true">
              <div class="upload-progress-bar" id="video-upload-progress-bar"></div>
            </div>
            <div class="upload-meta" id="video-upload-meta"></div>
            <button class="video-btn ghost upload-retry" type="button" id="video-upload-retry" hidden>重新上传</button>
          </div>
        </section>

        <section class="video-library">
          <div class="video-section-head">
            <div>
              <span>· LIBRARY ·</span>
              <h2>视频列表 <b id="video-count">0</b></h2>
            </div>
            <p>按最新资源优先展示</p>
          </div>

          <div class="video-filter-bar">
            <label class="video-search">
              <span>搜索</span>
              <input id="video-search-input" type="search" placeholder="搜索视频文件名...">
            </label>
            <button class="video-chip active" type="button" data-filter="all">全部</button>
            <button class="video-chip" type="button" data-filter="mp4">MP4</button>
            <button class="video-chip" type="button" data-filter="webm">WEBM</button>
            <button class="video-chip" type="button" data-filter="mov">MOV</button>
            <div class="video-view-toggle" aria-label="视图切换">
              <button class="active" type="button" data-view="grid">网格</button>
              <button type="button" data-view="list">列表</button>
            </div>
          </div>

          <div class="redesign-video-grid" id="video-grid"></div>

          <div class="video-stats" aria-label="视频统计">
            <div>
              <strong id="video-total-count">0</strong>
              <span>视频总数</span>
            </div>
            <div>
              <strong id="video-total-size">--</strong>
              <span>已用空间</span>
            </div>
            <div>
              <strong id="video-total-duration">--</strong>
              <span>总时长</span>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <template id="video-card-template">
    <article class="redesign-video-card">
      <div class="redesign-video-thumb">
        <video controls preload="metadata"></video>
        <span class="format-badge"></span>
        <span class="new-badge">新</span>
        <span class="duration-badge">--</span>
      </div>
      <div class="redesign-video-info">
        <strong class="redesign-video-name"></strong>
        <span class="redesign-video-path"></span>
        <div class="redesign-video-footer">
          <span class="redesign-video-size">--</span>
          <a class="icon-btn" href="#" download title="下载视频">下载</a>
        </div>
      </div>
    </article>
  </template>

  <script src="/js/video.js"></script>
</body>
</html>
