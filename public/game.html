<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIAOCHEN - 云海御剑</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-stage" aria-label="云海御剑小游戏">
      <header class="game-topbar">
        <a class="brand" href="/app.html" aria-label="返回图片库">
          <span>X</span>
          <strong>XIAOCHEN</strong>
        </a>
        <nav class="game-nav" aria-label="站内导航">
          <a href="/app.html">图片库</a>
          <a href="/video.html">视频库</a>
          <a class="active" href="/game.html">游戏</a>
          <a href="/profile.html">个人中心</a>
        </nav>
      </header>

      <button class="pause-button" id="pause-button" type="button" aria-label="暂停游戏">
        <span></span>
        <span></span>
      </button>

      <div class="game-hud" aria-live="polite">
        <div class="score-card">
          <span>分数</span>
          <strong id="score">0</strong>
        </div>
        <div class="qi-card">
          <span>灵气</span>
          <strong id="energy">0</strong>
        </div>
        <div class="best-card">
          <span>最高</span>
          <strong id="best-score">0</strong>
        </div>
      </div>

      <canvas id="sword-game" width="1280" height="720"></canvas>

      <div class="game-panel" id="start-panel">
        <span class="kicker">云海御剑</span>
        <h1>穿云破雾，收集灵气</h1>
        <p>按住空格、鼠标或屏幕上升，松开后下落。避开山峰、飞鸟和落石，灵气越多分数越高。</p>
        <button id="start-button" type="button">开始游戏</button>
      </div>

      <div class="game-panel game-over" id="game-over-panel" hidden>
        <span class="kicker">本局结束</span>
        <h2 id="final-score">0 分</h2>
        <p id="result-text">再试一次，保持飞剑在云海中间更稳。</p>
        <button id="restart-button" type="button">重新开始</button>
      </div>

      <div class="game-panel pause-panel" id="pause-panel" hidden>
        <span class="kicker">暂停中</span>
        <h2>云海暂歇</h2>
        <p>再次点击左上角按钮或按 P 继续御剑。</p>
        <button id="resume-button" type="button">继续游戏</button>
      </div>

      <div class="touch-pad" aria-hidden="true">
        <span>按住上升</span>
      </div>
    </section>
  </main>

  <script src="/js/game.js"></script>
</body>
</html>
