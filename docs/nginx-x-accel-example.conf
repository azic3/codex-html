server {
    listen 80;
    server_name 116.62.240.214;

    root /var/www/codexhtml/public;
    index login.html;

    client_max_body_size 1100m;
    sendfile on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location /api/ {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Accel-Enabled 1;
    }

    location /_protected_images/ {
        internal;
        alias /var/www/codexhtml/public/images/;
        expires 30d;
        add_header Cache-Control "private, max-age=2592000";
    }

    location /_protected_videos/ {
        internal;
        alias /var/www/codexhtml/public/videos/;
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/ogg ogg ogv;
            video/quicktime mov;
            video/x-msvideo avi;
            video/x-matroska mkv;
        }
        expires 1d;
        add_header Cache-Control "private" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
