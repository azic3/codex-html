server {
    listen 80;
    server_name 116.62.240.214;

    root /root/codexhtml/public;
    index login.html;

    client_max_body_size 1100m;
    sendfile on;

    location /api/ {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Enabled 1;
    }

    location /_protected_images/ {
        internal;
        alias /root/codexhtml/public/images/;
        expires 7d;
        add_header Cache-Control "private";
    }

    location /_protected_videos/ {
        internal;
        alias /root/codexhtml/public/videos/;
        expires 1d;
        add_header Cache-Control "private";
    }

    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
